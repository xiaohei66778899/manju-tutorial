<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" width="520" height="420" role="img" aria-label="玉哥 prompt 模板库：短剧 / 漫剧 / 共性">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE9D6"/>
      <stop offset="50%" stop-color="#FFF7E8"/>
      <stop offset="100%" stop-color="#ECE7FF"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1F1A14" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- 背景圆角 -->
  <rect width="520" height="420" rx="22" fill="url(#bg)"/>

  <!-- 装饰圆点(右上角小点缀) -->
  <circle cx="465" cy="48" r="6" fill="#635BFF" opacity="0.18"/>
  <circle cx="490" cy="80" r="3" fill="#635BFF" opacity="0.30"/>
  <circle cx="50"  cy="380" r="5" fill="#E8A33D" opacity="0.25"/>
  <circle cx="32"  cy="350" r="3" fill="#D6457E" opacity="0.20"/>

  <!-- ===== 卡片 1: 短剧(底层,左下,旋转 -8°) ===== -->
  <g transform="translate(30 175) rotate(-8 130 80)" filter="url(#shadow)">
    <rect width="260" height="156" rx="14" fill="#FFF7E8" stroke="#E8DFC8" stroke-width="1.2"/>
    <!-- tag -->
    <rect x="16" y="16" width="56" height="22" rx="11" fill="#FFE9D6"/>
    <text x="26" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#7A4A0F">短剧</text>
    <!-- 计数 -->
    <text x="226" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#7A4A0F" text-anchor="end">17</text>
    <!-- 模拟提示词文本行(5 条) -->
    <rect x="16" y="56" width="208" height="6" rx="3" fill="#E8DFC8"/>
    <rect x="16" y="74" width="170" height="6" rx="3" fill="#E8DFC8"/>
    <rect x="16" y="92" width="220" height="6" rx="3" fill="#E8DFC8"/>
    <rect x="16" y="110" width="148" height="6" rx="3" fill="#E8DFC8"/>
    <rect x="16" y="128" width="190" height="6" rx="3" fill="#E8DFC8"/>
    <!-- 变量高亮行 -->
    <rect x="16" y="128" width="46" height="6" rx="3" fill="#E8A33D" opacity="0.55"/>
  </g>

  <!-- ===== 卡片 2: 漫剧(中层,中间,旋转 0°) ===== -->
  <g transform="translate(140 90) rotate(0 130 80)" filter="url(#shadow)">
    <rect width="260" height="156" rx="14" fill="#FFF7E8" stroke="#E8DFC8" stroke-width="1.2"/>
    <rect x="16" y="16" width="56" height="22" rx="11" fill="#FBEDF3"/>
    <text x="26" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#A33466">漫剧</text>
    <text x="226" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#A33466" text-anchor="end">8</text>
    <rect x="16" y="56" width="180" height="6" rx="3" fill="#E8DFC8"/>
    <rect x="16" y="74" width="210" height="6" rx="3" fill="#E8DFC8"/>
    <rect x="16" y="92" width="160" height="6" rx="3" fill="#E8DFC8"/>
    <rect x="16" y="110" width="195" height="6" rx="3" fill="#E8DFC8"/>
    <rect x="16" y="128" width="170" height="6" rx="3" fill="#E8DFC8"/>
    <rect x="16" y="92" width="40" height="6" rx="3" fill="#D6457E" opacity="0.55"/>
  </g>

  <!-- ===== 卡片 3: 共性(顶层,右上,旋转 6°) ===== -->
  <g transform="translate(255 175) rotate(6 130 80)" filter="url(#shadow)">
    <rect width="260" height="156" rx="14" fill="#FFF7E8" stroke="#E8DFC8" stroke-width="1.2"/>
    <rect x="16" y="16" width="56" height="22" rx="11" fill="#F7EFDC"/>
    <text x="26" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#7A4A0F">共性</text>
    <text x="226" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#7A4A0F" text-anchor="end">7</text>
    <rect x="16" y="56" width="200" height="6" rx="3" fill="#E8DFC8"/>
    <rect x="16" y="74" width="160" height="6" rx="3" fill="#E8DFC8"/>
    <rect x="16" y="92" width="220" height="6" rx="3" fill="#E8DFC8"/>
    <rect x="16" y="110" width="178" height="6" rx="3" fill="#E8DFC8"/>
    <rect x="16" y="128" width="190" height="6" rx="3" fill="#E8DFC8"/>
    <rect x="16" y="56" width="50" height="6" rx="3" fill="#7A4A0F" opacity="0.55"/>
  </g>
</svg>